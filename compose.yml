services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kinema:kinema@db:5432/kinema?schema=public
      HOSTNAME: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kinema
      POSTGRES_USER: kinema
      POSTGRES_PASSWORD: kinema
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinema -d kinema"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
